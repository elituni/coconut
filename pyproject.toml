[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coconut-reproduction"
version = "0.1.0"
description = "An independent GPT-2 study of continuous latent reasoning on ProsQA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "transformers==4.51.3", "tqdm>=4.66,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<0.12"]

[project.scripts]
coconut = "coconut_reproduction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
